<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="SEAD">
    <meta name="apple-mobile-web-app-title" content="tarefa">
    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos mantidos 100% conforme o original */
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; background:#6366f1; color:white; display:flex; flex-direction: column; justify-content:center; align-items:center; z-index:1000; gap: 20px; }
        .splash-logo { width: 100px; height: auto; margin-bottom: 10px; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: rgb(169, 231, 226); padding: 2rem; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .header-container { display: flex; align-items: center; justify-content: flex-start; gap: 15px; margin-bottom: 20px; }
        .logo { width: 50px; height: auto; }
        h1 { margin: 0; font-size: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        #addBtn { padding: 12px; border: none; border-radius: 8px; background: #6366f1; color: white; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: #e5e7eb; color: #666; display: flex; flex-direction: column; align-items: center; }
        .tab-btn.active { background: #6366f1; color: white; }
        .count-badge { font-size: 0.7rem; font-weight: bold; margin-top: 2px; }
        
        /* Estilos da Lista e Botões */
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; margin-bottom: 5px; border-radius: 8px;}
        .task-info { display: flex; flex-direction: column; }
        .date-label { font-size: 0.75rem; color: #888; }
        .done-date { font-size: 0.75rem; color: #22c55e; font-weight: bold; }
        .done { text-decoration: line-through; color: #9ca3af; }
        .actions { display: flex; gap: 10px; }
        .icon-btn { cursor: pointer; border: none; background: none; font-size: 1.1rem; color: #6366f1; }
        
        #notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff4757; color: white; padding: 12px 25px; border-radius: 50px; display: none; font-weight: bold; z-index: 2000; }
        #statusNotification { display:none; position:fixed; top:20px; right:20px; background:#22c55e; color:white; padding:15px 25px; border-radius:8px; z-index:9999; box-shadow: 0 4px 6px rgba(0,0,0,0.2); font-weight:bold; }
        
        #resultModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 300px; }
        
        /* Ajuste do Título com engrenagem */
        .title-wrapper { display: flex; align-items: center; gap: 15px; }
        .settings-btn { background: none; border: none; cursor: pointer; font-size: 24px; padding: 0; }
        .btn-close { background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; }
    
        /* Estilo moderno para Modais */
        #settingsModal, #confirmModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 5000; justify-content: center; align-items: center; }
        .settings-card { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .setting-option { margin-bottom: 20px; }
        .setting-option label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
        .modern-select { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 12px; background-color: #f9fafb; font-size: 1rem; cursor: pointer; }

        /* Estilos para o Modo Escuro */
        body.dark-mode { background: #1f2937; color: white; }
        body.dark-mode .container { background: #374151; color: white; }
        body.dark-mode li { background: #4b5563; border-color: #6b7280; }
        body.dark-mode input, body.dark-mode select { background: #1f2937; color: white; border-color: #6b7280; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="logo.png" alt="Logo" class="splash-logo">
        <div class="spinner"></div>
        <div>Carregando...</div>
    </div>

    <div id="statusNotification">Tarefa salva!</div>

    <div class="container">
        <div class="header-container">
            <img src="logo.png" alt="Logo" class="logo">
            <div class="title-wrapper">
                <h1>Tarefas</h1>
                <button class="settings-btn" onclick="document.getElementById('settingsModal').style.display = 'flex'">⚙️</button>
            </div>
        </div>
        
        <button onclick="window.location.href='pagamento.html'" style="background: #f59e0b; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-bottom: 15px; cursor: pointer; font-weight: bold;">
            <i class="fas fa-crown"></i> Ativar Acesso Premium
        </button>
        
        <div id="idContainer" style="font-size: 0.85rem; color: #444; margin-bottom: 15px; background: rgba(255,255,255,0.5); padding: 8px; border-radius: 8px;">
            Seu ID de Acesso: <span id="userDeviceId" style="font-weight:bold;"></span>
        </div>
        
        <div class="input-group">
            <label>Tarefa</label>
            <input type="text" id="taskInput" placeholder="O que fazer?">
            <label>Data</label>
            <input type="date" id="dateInput">
            <label>Hora</label>
            <input type="time" id="timeInput">
            <button id="addBtn">Adicionar</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="btnPending" onclick="setFilter('pending')">
                Pendentes <span id="countPending" class="count-badge">0</span>
            </button>
            <button class="tab-btn" id="btnCompleted" onclick="setFilter('completed')">
                Concluídas <span id="countCompleted" class="count-badge">0</span>
            </button>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.8rem; color: #50C878;">Pesquisar por Data (vazio = todos):</label>
            <input type="date" id="searchDate" onchange="render()" style="width: 100%; box-sizing: border-box;">
        </div>

        <ul id="taskList"></ul>
    </div>

    <div id="resultModal">
        <div class="modal-content">
            <h3>Tarefa Cadastrada!</h3>
            <p id="modalTaskText" style="margin: 15px 0; font-weight: bold;"></p>
            <button class="btn-close" onclick="document.getElementById('resultModal').style.display = 'none'">Fechar</button>
        </div>
    </div>

    <div id="notification">Por favor, digite uma tarefa!</div>

    <div id="settingsModal">
        <div class="settings-card">
            <h2 style="margin-top: 0; color: #111827; font-size: 1.25rem;">Settings</h2>
            <div class="setting-option">
                <label>Language</label>
                <select id="langSelect" class="modern-select">
                    <option value="pt">Português (PT)</option>
                    <option value="en">English (EN)</option>
                </select>
            </div>
            <div class="setting-option">
                <label>Theme Mode</label>
                <select id="themeSelect" class="modern-select">
                    <option value="light">Light Mode</option>
                    <option value="dark">Dark Mode</option>
                </select>
            </div>
            <button class="btn-close" onclick="applySettings(); document.getElementById('settingsModal').style.display = 'none'">Save Changes</button>
        </div>
    </div>

    <div id="confirmModal">
        <div class="settings-card">
            <h2 id="confirmTitle" style="font-size: 1.2rem; margin-top: 0; color: #111827;">Tem certeza?</h2>
            <p id="confirmMessage" style="color: #666; margin-bottom: 20px;">Esta ação não poderá ser desfeita.</p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeConfirmModal()" style="flex: 1; padding: 10px; border: none; border-radius: 8px; background: #e5e7eb; cursor: pointer;">Cancelar</button>
                <button id="confirmActionBtn" onclick="executeAction()" style="flex: 1; padding: 10px; border: none; border-radius: 8px; background: #ef4444; color: white; cursor: pointer;">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        let deviceId = localStorage.getItem('userDeviceId');
        if (!deviceId) {
            deviceId = "CLI-" + Math.floor(10000 + Math.random() * 90000);
            localStorage.setItem('userDeviceId', deviceId);
        }
        document.getElementById('userDeviceId').innerText = deviceId;

        let isPremium = false; 
        async function verificarAcesso() {
            const deviceId = localStorage.getItem('userDeviceId');
            if (!deviceId) return;
            const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkuZzRjNJSWlWltzXJgXot4Ryc9WtkKlsEy2eMsLQImd2-wR71Ja-FdCFtZMHMWVAoO7JiHOWSFESa/pub?gid=0&single=true&output=csv&t=" + new Date().getTime();
            try {
                const resposta = await fetch(urlCSV);
                const texto = await resposta.text();
                const linhas = texto.split('\n');
                const ehPremium = linhas.some(linha => {
                    const colunas = linha.split(',');
                    const idNaPlanilha = colunas[1] ? colunas[1].trim().toUpperCase() : "";
                    const statusNaPlanilha = colunas[3] ? colunas[3].trim().toUpperCase() : "";
                    const idLimpo = deviceId.trim().toUpperCase();
                    return idNaPlanilha === idLimpo && statusNaPlanilha === "PAGO";
                });
                if (ehPremium) {
                    isPremium = true; 
                    const container = document.querySelector('.container');
                    if(container) container.style.border = "4px solid #22c55e";
                    const btnPremium = document.querySelector('button[onclick*="pagamento.html"]');
                    if(btnPremium) {
                        btnPremium.innerHTML = '<i class="fas fa-check-circle"></i> Premium Ativado';
                        btnPremium.style.backgroundColor = "#22c55e";
                        btnPremium.onclick = null;
                    }
                }
            } catch (e) { console.error("Erro na verificação:", e); }
        }
        window.addEventListener('load', verificarAcesso);

        function mostrarStatus(mensagem) {
            const el = document.getElementById('statusNotification');
            el.innerText = mensagem;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 1500);
        
        let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];
        let filter = 'pending';

        function save() { 
            localStorage.setItem('myTasks', JSON.stringify(tasks)); 
            if (window.AppInventor) window.AppInventor.setWebViewString(JSON.stringify(tasks));
            render(); 
        }

        function setFilter(f) {
            filter = f;
            document.getElementById('btnPending').classList.toggle('active', f === 'pending');
            document.getElementById('btnCompleted').classList.toggle('active', f === 'completed');
            render();
        }

        function toggleTask(i) {
            tasks[i].completed = !tasks[i].completed;
            tasks[i].finishedAt = tasks[i].completed ? new Date().toLocaleDateString('pt-BR') : null;
            save();
        }

        function deleteTask(i) { tasks.splice(i, 1); save(); }

        function render() {
            const list = document.getElementById('taskList');
            list.innerHTML = "";
            const searchDate = document.getElementById('searchDate').value;
            const formattedSearchDate = searchDate ? searchDate.split('-').reverse().join('/') : null;
            
            const pendingTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);
            
            document.getElementById('countPending').innerText = pendingTasks.length;
            document.getElementById('countCompleted').innerText = completedTasks.length;

            tasks.forEach((task, index) => {
                const matchesFilter = (filter === 'completed' && task.completed) || (filter === 'pending' && !task.completed);
                const matchesDate = !formattedSearchDate || task.date === formattedSearchDate;
                
                if (matchesFilter && matchesDate) {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="task-info">
                            <span class="${task.completed ? 'done' : ''}">${task.text}</span>
                            <small class="date-label">${task.date ? 'Data: ' + task.date : ''} ${task.time ? 'às ' + task.time : ''}</small>
                            ${task.completed ? `<small class="done-date">Concluído em: ${task.finishedAt}</small>` : ''}
                        </div>
                        <div class="actions">
                            <button class="icon-btn" onclick="openConfirmModal(${index}, 'toggle', ${task.completed})"><i class="fas ${task.completed ? 'fa-undo' : 'fa-check-circle'}"></i></button>
                            <button class="icon-btn" onclick="openConfirmModal(${index}, 'delete', false)"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    list.appendChild(li);
                }
            });
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            const input = document.getElementById('taskInput');
            const modal = document.getElementById('resultModal');
            if (!isPremium && tasks.length >= 5) {
                modal.querySelector('h3').innerText = "Limite Atingido! 🚀";
                document.getElementById('modalTaskText').innerText = "Limite de 5 tarefas atingido! Assine o plano Premium.";
                modal.style.display = 'flex';
                return;
            }
            if (!input.value) {
                document.getElementById('notification').style.display = 'block';
                setTimeout(() => { document.getElementById('notification').style.display = 'none'; }, 3000);
                return;
            }
            tasks.push({ text: input.value, date: document.getElementById('dateInput').value.split('-').reverse().join('/'), time: document.getElementById('timeInput').value, completed: false, createdAt: new Date().toLocaleDateString('pt-BR') });
            save();
            document.getElementById('modalTaskText').innerText = input.value;
            modal.style.display = 'flex';
            input.value = "";
            mostrarStatus("Tarefa adicionada!");
        });

        function applySettings() {
            document.body.classList.toggle('dark-mode', document.getElementById('themeSelect').value === 'dark');
            const t = {
                'en': { title: 'Tasks', add: 'Add', pending: 'Pending', completed: 'Completed' },
                'pt': { title: 'Tarefas', add: 'Adicionar', pending: 'Pendentes', completed: 'Concluídas' }
            }[document.getElementById('langSelect').value];
            document.querySelector('h1').innerText = t.title;
            document.getElementById('addBtn').innerText = t.add;
            document.getElementById('btnPending').childNodes[0].textContent = t.pending + ' ';
            document.getElementById('btnCompleted').childNodes[0].textContent = t.completed + ' ';
        }

        let currentTaskId = null, currentAction = null;
        function openConfirmModal(id, action, isCompleted) {
            currentTaskId = id; 
            currentAction = action;
            const title = document.getElementById('confirmTitle');
            const msg = document.getElementById('confirmMessage');
            const btn = document.getElementById('confirmActionBtn');
            
            if (action === 'delete') {
                title.innerText = "Excluir";
                msg.innerText = "Tem certeza que deseja excluir esta tarefa?";
                btn.style.background = "#ef4444";
            } else {
                title.innerText = isCompleted ? "Desfazer Conclusão" : "Concluir Tarefa";
                msg.innerText = isCompleted ? "Deseja tornar esta tarefa pendente novamente?" : "Deseja marcar esta tarefa como concluída?";
                btn.style.background = "#22c55e";
            }
            document.getElementById('confirmModal').style.display = 'flex';
        }
        function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; }
        function executeAction() { currentAction === 'delete' ? deleteTask(currentTaskId) : toggleTask(currentTaskId); closeConfirmModal(); }

        render();
    </script>
</body>
</html>
